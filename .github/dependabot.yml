version: 2

updates:
  # Python runtime + dev dependencies (via Poetry / pyproject.toml).
  # Dependabot opens a PR whenever a new upstream version is published,
  # so we get a heads-up on every supply-chain event and can review the
  # diff (release notes + lockfile hash change) before merging.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      # Group routine patch updates so the PR queue stays manageable.
      patch-updates:
        update-types:
          - "patch"
    # Security advisories always come through, even for ignored deps.
    # See https://docs.github.com/en/code-security/dependabot.

  # Pinned GitHub Actions used by the publish + python workflows.
  # Action SHAs/tags are a supply-chain surface too; surface upgrades
  # via PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
